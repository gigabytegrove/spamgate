name: SpamGate native release qualification
on:
  # Local gh publication on dockeradm remains the authoritative release path.
  # This manual job only produces independently tested downloadable artifacts.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact 40-character main commit SHA to qualify'
        required: true
        type: string
permissions:
  contents: read
jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Pin the exact source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full native release qualification and negative asset tests
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/build-github-assets.sh "$RUNNER_TEMP/spamgate-native-release"
      - uses: actions/upload-artifact@v4
        with:
          name: spamgate-native-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/spamgate-native-release/*
          if-no-files-found: error
          retention-days: 14
