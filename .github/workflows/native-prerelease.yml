name: Native development releases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-prerelease.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/**'
      - 'go.mod'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spamgate-native-0.4.0-alpha.2
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.repository == 'gigabytegrove/spamgate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Install patched Go 1.27.3
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Test, inspect and package native builds
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(go env GOVERSION)" = 'go1.27.3'
          go test ./...
          go test -race ./...
          go vet ./...
          bash -n scripts/*.sh
          bash scripts/build-release.sh "$GITHUB_WORKSPACE/dist"
          for archive in dist/*.zip; do unzip -t "$archive" >/dev/null; done
          for archive in dist/*.tar.gz; do tar -tzf "$archive" >/dev/null; done
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w -H=windowsgui' -o dist/SpamGate-0.4.0-alpha.2-windows-amd64.exe ./cmd/spamgate
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o dist/SpamGate-0.4.0-alpha.2-linux-amd64 ./cmd/spamgate
          chmod 0755 dist/SpamGate-0.4.0-alpha.2-linux-amd64
          test "$(dist/SpamGate-0.4.0-alpha.2-linux-amd64 -version)" = '0.4.0-alpha.2'
          (cd dist && sha256sum SpamGate-0.4.0-alpha.2-windows-amd64.exe SpamGate-0.4.0-alpha.2-linux-amd64 *.zip *.tar.gz > SHA256SUMS.txt)
      - name: Publish persistent private GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          tag='v0.4.0-alpha.2'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing release $tag is unchanged."
            exit 0
          fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'SpamGate v0.4.0-alpha.2 — native development preview' \
            --prerelease \
            --notes 'Native-first development preview. Go 1.27.3 builds: Linux amd64/arm64, Windows amd64/arm64. Individual Linux and Windows x64 binaries are available without ZIP extraction. Checksums supplied. Windows files are UNSIGNED and have not been Defender-certified. Not approved for production mail routing; use only for controlled testing. Repository is private: sign in to GitHub to download.'
