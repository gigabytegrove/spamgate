name: SpamGate real Postfix and Dovecot lab — isolated VM

on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spamgate-postfix-real-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-postfix-milter:
    if: github.repository == 'gigabytegrove/spamgate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install isolated Postfix and Dovecot test components
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'postfix postfix/mailname string localhost\npostfix postfix/main_mailer_type select Local only\n' | sudo debconf-set-selections
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq postfix dovecot-core dovecot-imapd dovecot-sieve
          if ! id spamgatebeta >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash spamgatebeta
          fi
          sudo postconf -e 'inet_interfaces = loopback-only'
          sudo postconf -e 'inet_protocols = ipv4'
          sudo postconf -e 'mydestination = localhost, localhost.localdomain'
          sudo postconf -e 'mynetworks = 127.0.0.0/8'
          sudo postconf -e 'home_mailbox = Maildir/'
          sudo postconf -e 'mailbox_command = /usr/lib/dovecot/dovecot-lda'
          sudo postconf -e 'smtpd_milters = inet:127.0.0.1:38472'
          sudo postconf -e 'non_smtpd_milters ='
          sudo postconf -e 'milter_default_action = tempfail'
          sudo postconf -e 'milter_protocol = 6'
          # Loopback-only ephemeral lab: do not advertise the distro's unrelated
          # self-signed STARTTLS certificate to net/smtp. Production TLS is a
          # separate, stricter qualification path and is never disabled here.
          sudo postconf -e 'smtpd_tls_security_level = none'
          sudo postconf -e 'smtpd_recipient_restrictions = permit_mynetworks,reject_unauth_destination'
          sudo postfix check
          if sudo postfix status; then
            sudo postfix reload
          else
            sudo postfix start
          fi
          # This runner is disposable; Dovecot reads Maildir from the local test user's home.
          sudo sed -i -E 's|^[# ]*mail_location[[:space:]]*=.*|mail_location = maildir:~/Maildir|' /etc/dovecot/conf.d/10-mail.conf
          # Ubuntu's passwd userdb returns mail=mbox even when global mail_location
          # is Maildir. Override at namespace scope so Dovecot reads the exact
          # Maildir used by Postfix's home_mailbox in this disposable lab.
          grep -q '^namespace inbox {' /etc/dovecot/conf.d/15-mailboxes.conf
          sudo sed -i '/^namespace inbox {/a\  location = maildir:~/Maildir' /etc/dovecot/conf.d/15-mailboxes.conf
          # Disposable CI host only: Postfix delivers through Dovecot LDA, so
          # the Sieve rule is exercised on the real SMTP -> Milter -> LDA path.
          # This is NOT an installer or a production MTA configuration change.
          sudo test -x /usr/lib/dovecot/dovecot-lda
          sudo install -d -m 0755 /etc/dovecot/sieve
          sudo install -m 0644 scripts/fixtures/spamgate-junk.sieve /etc/dovecot/sieve/spamgate-ci.sieve
          sudo sievec /etc/dovecot/sieve/spamgate-ci.sieve
          printf '%s\n' 'protocol lda {' '  mail_plugins = $mail_plugins sieve' '}' 'plugin {' '  sieve_before = /etc/dovecot/sieve/spamgate-ci.sieve' '}' | sudo tee /etc/dovecot/conf.d/99-spamgate-ci-sieve.conf >/dev/null
          sudo systemctl restart dovecot
          sudo doveadm user spamgatebeta
          sudo doveadm mailbox create -u spamgatebeta Junk
          sudo doveadm mailbox list -u spamgatebeta

          sudo doveconf -n
          sudo postfix status
          sudo postconf -n | grep -E 'milter|mydestination|home_mailbox|mailbox_command|inet_interfaces'
          sudo doveconf -n | grep -E 'sieve_before|mail_plugins|mail_location'
          ss -ltn | grep -E ':25[[:space:]]'

      - name: Real Postfix accept, synthetic reject and storage tempfail
        env:
          CI: 'true'
          SPAMGATE_POSTFIX_LAB: '1'
          CGO_ENABLED: '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p lab-evidence
          go test -count=1 -v -run '^TestRealPostfixMilterLocalDeliveryAndTempfail$' ./internal/transport | tee lab-evidence/postfix-milter-test.log

      - name: Dovecot verifies real mailbox visibility
        shell: bash
        run: |
          set -Eeuo pipefail
          # Only a test-only user, inside an ephemeral GitHub runner.
          getent passwd spamgatebeta
          sudo doveadm user spamgatebeta
          sudo ls -ld /home/spamgatebeta /home/spamgatebeta/Maildir /home/spamgatebeta/Maildir/new
          sudo doveadm mailbox list -u spamgatebeta
          sudo doveadm force-resync -u spamgatebeta INBOX
          INBOX_STATUS="$(sudo doveadm mailbox status -u spamgatebeta messages INBOX)"
          JUNK_STATUS="$(sudo doveadm mailbox status -u spamgatebeta messages Junk)"
          INBOX_UIDS="$(sudo doveadm search -u spamgatebeta mailbox INBOX ALL)"
          JUNK_UIDS="$(sudo doveadm search -u spamgatebeta mailbox Junk ALL)"
          printf 'Dovecot INBOX status: %s\n' "$INBOX_STATUS"
          printf 'Dovecot Junk status: %s\n' "$JUNK_STATUS"
          printf 'Dovecot INBOX UIDs: %s\n' "$INBOX_UIDS"
          printf 'Dovecot Junk UIDs: %s\n' "$JUNK_UIDS"
          # INBOX: normal accept, null sender, released hold, forged-header
          # accept. Junk: exactly one real Milter-tagged message. Reject and
          # storage tempfail produce no additional mailbox deliveries.
          INBOX_COUNT="$(printf '%s\n' "$INBOX_UIDS" | sed '/^$/d' | wc -l | tr -d ' ')"
          JUNK_COUNT="$(printf '%s\n' "$JUNK_UIDS" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$INBOX_COUNT" -ne 4 ] || [ "$JUNK_COUNT" -ne 1 ] ||
             ! printf '%s\n' "$INBOX_STATUS" | grep -Eq 'INBOX messages=4([[:space:]]|$)' ||
             ! printf '%s\n' "$JUNK_STATUS" | grep -Eq 'Junk messages=1([[:space:]]|$)'; then
            sudo doveadm -Dv search -u spamgatebeta ALL || true
            echo "Expected exactly four INBOX and one Junk messages; observed $INBOX_COUNT / $JUNK_COUNT"
            exit 1
          fi
          printf '%s\n' "$INBOX_STATUS" "$JUNK_STATUS" > lab-evidence/dovecot-mailbox-counts.txt

      - name: Postfix queue and delivery diagnostics
        if: always()
        shell: bash
        run: |
          sudo postqueue -p || true
          sudo postfix status || true
          sudo ls -la /home/spamgatebeta/Maildir/new || true
          sudo ls -la /home/spamgatebeta/Maildir/cur || true
          sudo ls -la /home/spamgatebeta/Maildir/.Junk/new || true
          sudo ls -la /home/spamgatebeta/Maildir/.Junk/cur || true

      - name: Preserve exact-commit integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spamgate-postfix-dovecot-${{ github.sha }}
          path: lab-evidence/*
          if-no-files-found: warn
          retention-days: 7
