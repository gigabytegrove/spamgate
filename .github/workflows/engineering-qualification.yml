name: SpamGate engineering qualification — no automatic release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spamgate-engineering-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'gigabytegrove/spamgate'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install patched Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install Node for UI regression
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Go unit and race tests
        run: |
          set -Eeuo pipefail
          go test -count=1 ./...
          CGO_ENABLED=1 go test -race -p 1 -count=1 -timeout=15m ./...
          go vet ./...
      - name: UI regressions and native migration
        run: |
          set -Eeuo pipefail
          node --check internal/server/assets/app.js
          node --test scripts/ui-regression.test.mjs
          bash -n scripts/build-github-assets.sh
          bash -n scripts/migrate-native-launcher.sh
          bash scripts/test-migrate-native-launcher.sh
          bash scripts/test-supervised-updates.sh
          bash -n scripts/install-postfix-release-helper.sh scripts/test-install-postfix-release-helper.sh
          bash scripts/test-install-postfix-release-helper.sh
          bash -n scripts/install-dovecot-sieve.sh scripts/test-install-dovecot-sieve.sh
          bash scripts/test-install-dovecot-sieve.sh
      - name: Native host and filtration qualification regressions
        run: |
          set -Eeuo pipefail
          # unittest discover silently skips hyphenated filenames: invoke each directly.
          python3 -m py_compile scripts/install-native-systemd.py
          python3 scripts/test-native-systemd.py -v
          python3 scripts/test-spamgate-host-probe.py -v
          python3 scripts/test-spamgate-host-probe-smtp.py -v
          python3 scripts/test-spamgate-filtration-qualification.py -v
          python3 scripts/test-spamgate-postfix-evidence.py -v
          python3 scripts/test-spamgate-maildir-evidence.py -v
          python3 scripts/spamgate-host-probe.py > /tmp/spamgate-preflight.json
          python3 -c 'import json; r=json.load(open("/tmp/spamgate-preflight.json")); assert r["status"] == "preflight_only" and not r["smtp"]["attempted"]'
      - name: Compile native Linux and Windows programs
        env:
          CGO_ENABLED: '0'
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o dist/spamgate-worker-linux-amd64 ./cmd/spamgate
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o dist/spamgate-launcher-linux-amd64 ./cmd/spamgate-run
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o dist/spamgate-eval-linux-amd64 ./cmd/spamgate-eval
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o dist/spamgate-postfix-release-linux-amd64 ./cmd/spamgate-postfix-release
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o dist/spamgate-spool-audit-linux-amd64 ./cmd/spamgate-spool-audit
          GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w -H=windowsgui' -o dist/spamgate-windows-amd64.exe ./cmd/spamgate
          # Exercise the compiled native evaluator, not only go test fixtures.
          EVAL_TEST_DIR="$(mktemp -d)"
          printf '%s\n' '{"label":"ham","action":"accept","cohort":"direct","id":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}' '{"label":"spam","action":"reject","cohort":"direct","id":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}' '{"label":"ham","action":"accept","cohort":"forwarded","id":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"}' '{"label":"spam","action":"reject","cohort":"forwarded","id":"dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"}' > "$EVAL_TEST_DIR/labels.jsonl"
          dist/spamgate-eval-linux-amd64 --require-unique-ids --require-cohorts --min-ham=1 --min-spam=1 --max-fpr-upper=1 --min-recall-lower=0 --min-cohort-ham=1 --min-cohort-spam=1 --max-cohort-fpr-upper=1 --min-cohort-recall-lower=0 "$EVAL_TEST_DIR/labels.jsonl" | grep -q '"cohort_gate_passed":true'
          rm -rf "$EVAL_TEST_DIR"
          chmod 0755 dist/spamgate-worker-linux-amd64 dist/spamgate-launcher-linux-amd64 dist/spamgate-spool-audit-linux-amd64 dist/spamgate-postfix-release-linux-amd64
          if dist/spamgate-postfix-release-linux-amd64 ALL > /dev/null 2>&1; then echo 'Privileged helper accepted unsafe invocation' >&2; exit 1; fi
          AUDIT_TEST_DIR="$(mktemp -d)"
          mkdir -m 0700 "$AUDIT_TEST_DIR/queue"
          dist/spamgate-spool-audit-linux-amd64 -dir "$AUDIT_TEST_DIR/queue" -json | grep -q '"published": 0'
          rm -rf "$AUDIT_TEST_DIR"
          test "$(dist/spamgate-worker-linux-amd64 -version)" = "$(go run ./cmd/spamgate -version)"
          test "$(dist/spamgate-launcher-linux-amd64 -version)" = "$(go run ./cmd/spamgate -version)"
          (cd dist && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Preserve unreleased qualification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spamgate-engineering-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
