name: SpamGate long-term beta release — qualified native pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beta1-release.yml'
      - 'scripts/test-supervised-updates.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spamgate-v0.6.0-beta.1-release
  cancel-in-progress: false

jobs:
  postfix-dovecot:
    name: Real Postfix/Dovecot isolated lab acceptance
    uses: ./.github/workflows/postfix-dovecot-lab.yml

  qualify-native-and-publish:
    needs: postfix-dovecot
    if: github.repository == 'gigabytegrove/spamgate'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Patched Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Node for UI test suite
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full exact-source release gates, native builds and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(go env GOVERSION)" = 'go1.27.3'
          test "$(go run ./cmd/spamgate -version)" = '0.6.0-beta.1'
          bash scripts/build-github-assets.sh "$RUNNER_TEMP/spamgate-beta1"
          cd "$RUNNER_TEMP/spamgate-beta1"
          sha256sum -c SHA256SUMS.txt
          test "$(./spamgate-launcher-linux-amd64 -version)" = '0.6.0-beta.1'
          test "$(./spamgate-worker-linux-amd64 -version)" = '0.6.0-beta.1'
          cmp -s spamgate-linux-amd64 spamgate-worker-linux-amd64
      - name: Publish immutable pilot prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG='v0.6.0-beta.1'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists: refusing overwrite" >&2
            exit 1
          fi
          cd "$RUNNER_TEMP/spamgate-beta1"
          gh release create "$TAG" \
            spamgate-launcher-linux-amd64 \
            spamgate-worker-linux-amd64 \
            spamgate-linux-amd64 \
            spamgate-windows-amd64.exe \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "SpamGate v0.6.0-beta.1 — Long-term pilot" \
            --notes "Pilot beta with verified native split launcher/worker, durable SMTP crash recovery, journal integrity and compaction guards, admin history audit, categories/SGTUBE, 20 benign classification regressions and disposable real Postfix/Dovecot test. Tested commit: $GITHUB_SHA. This is a controlled LONG-TERM BETA, not certified as sole production enforcement on user ISPConfig/Dovecot hosts. Real host mail disposition, hard rejection false positives, TLS, throughput and disaster recovery remain explicit gates in docs/MAIL_DURABILITY_BETA_GATE.md. Never install spamgate-linux-amd64 as the native launcher; download spamgate-launcher-linux-amd64 for ./spamgate and spamgate-worker-linux-amd64 for ./spamgate-worker. Windows asset is unsigned."
      - name: Verify downloaded release bytes against qualified build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/spamgate-release-verify"
          gh release download 'v0.6.0-beta.1' \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/spamgate-release-verify"
          cd "$RUNNER_TEMP/spamgate-release-verify"
          sha256sum -c SHA256SUMS.txt
          cmp -s SHA256SUMS.txt "$RUNNER_TEMP/spamgate-beta1/SHA256SUMS.txt"
          chmod 0755 spamgate-launcher-linux-amd64 spamgate-worker-linux-amd64
          test "$(./spamgate-launcher-linux-amd64 -version)" = '0.6.0-beta.1'
          test "$(./spamgate-worker-linux-amd64 -version)" = '0.6.0-beta.1'
